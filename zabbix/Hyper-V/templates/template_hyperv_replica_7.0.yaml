      value: availability
    recovery_mode: RECOVERY_EXPRESSION
    recovery_expression: last(/NOMMA Hyper-V and Replica by Zabbix agent/hyperv.cluster.service)=1 or last(/NOMMA Hyper-V and Replica by Zabbix agent/hyperv.cluster.present)=0
  - uuid: ec3562bba4154d4692c8462c4a31e899
    expression: last(/NOMMA Hyper-V and Replica by Zabbix agent/hyperv.cluster.present)=1 and last(/NOMMA Hyper-V and Replica by Zabbix agent/hyperv.cluster.service)=1
      and max(/NOMMA Hyper-V and Replica by Zabbix agent/hyperv.cluster.node_up,3m)=0
