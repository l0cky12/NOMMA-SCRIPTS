  - uuid: e58987f1f794448b82e8e575b26b1ed1
    expression: last(/NOMMA Hyper-V and Replica by Zabbix agent/hyperv.cluster.broker_present)=1 and last(/NOMMA Hyper-V and Replica by Zabbix agent/hyperv.cluster.service)=1
      and max(/NOMMA Hyper-V and Replica by Zabbix agent/hyperv.cluster.broker_online,3m)=0
