zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 8431f11b0159462880943aaa7b544fd9
    name: Templates/Virtualization
  templates:
  - uuid: cb960109204743119cf74837d2732ea6
    template: NOMMA Hyper-V and Replica by Zabbix agent
    name: NOMMA Hyper-V and Replica by Zabbix agent
    description: Lean operational monitoring for Windows Server Hyper-V, Hyper-V Replica, failover clustering, CSVs, external switches, selected certificates, and
      backup freshness. Built for Zabbix 7.0.28 LTS and verified 2026-07-10 UTC. Link the official Windows by Zabbix agent template separately for OS availability
      and baseline CPU/memory/disk telemetry.
    vendor:
      name: NOMMA
      version: 1.0.0
    groups:
    - name: Templates/Virtualization
    items:
    - uuid: 6f74dbc1342d47f2b58d5a28a780deaa
      name: 'Hyper-V: Raw health data'
      key: hyperv.collect
      delay: 1m
      history: 1d
      value_type: TEXT
      trends: '0'
      description: Single read-only PowerShell collection. All other custom metrics are dependent items.
      tags:
      - tag: component
        value: raw
      - tag: scope
        value: health
    - uuid: f2eab686b77d471db08091c67ffd77bd
      name: 'Hyper-V: Collector status'
      type: DEPENDENT
      key: hyperv.collector.ok
      delay: '0'
      history: 30d
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.collector.ok
      master_item:
        key: hyperv.collect
      tags:
      - tag: component
        value: collector
      - tag: scope
        value: health
      trends: 365d
      valuemap:
        name: NOMMA binary status
    - uuid: e37e45f6de5a462a830fbf7f5f2ec0c2
