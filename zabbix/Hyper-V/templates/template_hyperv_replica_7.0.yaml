  triggers:
  - uuid: 559f1b47828344369e2c38afd1baf380
    expression: nodata(/NOMMA Hyper-V and Replica by Zabbix agent/hyperv.collect,5m)=1
    name: 'Hyper-V: No collector data'
    priority: HIGH
    description: The agent/UserParameter has returned no master-item data for five minutes.
    tags:
    - tag: scope
      value: availability
  - uuid: 56720a8932954214ae37e5aacc8d580e
    expression: max(/NOMMA Hyper-V and Replica by Zabbix agent/hyperv.collector.ok,3m)=0
    name: 'Hyper-V: Collector failed'
    priority: HIGH
    description: PowerShell could not collect core Hyper-V data. Check the collector error item.
    tags:
    - tag: scope
      value: availability
    recovery_mode: RECOVERY_EXPRESSION
    recovery_expression: last(/NOMMA Hyper-V and Replica by Zabbix agent/hyperv.collector.ok)=1

  - uuid: 41887afa7fd3462ba36e39ac3e7ed2ce
    expression: last(/NOMMA Hyper-V and Replica by Zabbix agent/hyperv.cluster.present)=1 and max(/NOMMA Hyper-V and Replica by Zabbix agent/hyperv.cluster.service,3m)=0
    name: 'Hyper-V Cluster: Cluster service is down'
    priority: HIGH
    description: ''
    tags:
