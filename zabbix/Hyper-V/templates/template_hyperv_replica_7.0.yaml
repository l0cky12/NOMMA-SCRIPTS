    recovery_expression: last(/NOMMA Hyper-V and Replica by Zabbix agent/hyperv.cluster.broker_online)=1 or last(/NOMMA Hyper-V and Replica by Zabbix agent/hyperv.cluster.broker_present)=0
  - uuid: 3f3afcd260df45b8972818201d5f0b16
