    discovery_rules:
    - uuid: abfc6bea923c4e31be0fa83d68262ef4
      name: Hyper-V VM discovery
      type: DEPENDENT
      key: hyperv.vm.discovery
      delay: '0'
      lifetime: 7d
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.vms
      master_item:
        key: hyperv.collect
      item_prototypes:
      - uuid: 962baba541c942c1949ec09be2e580fc
        name: 'VM {#VMNAME}: State'
        type: DEPENDENT
        key: hyperv.vm.state["{#VMID}"]
        delay: '0'
        history: 30d
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.vms[?(@.id == "{#VMID}")].state.first()
        master_item:
          key: hyperv.collect
        tags:
        - tag: component
          value: vm
        - tag: scope
          value: health
        valuemap:
          name: NOMMA Hyper-V VM state
        trigger_prototypes:
        - uuid: 552c49ca03cb405e88118a77ae718d45
          expression: '{$HYPERV.VM.MONITOR:"{#VMID}"}=1 and last(/NOMMA Hyper-V and Replica by Zabbix agent/hyperv.collector.ok)=1 and last(/NOMMA Hyper-V and Replica
            by Zabbix agent/hyperv.service.vmms)=1 and last(/NOMMA Hyper-V and Replica by Zabbix agent/hyperv.vm.state["{#VMID}"],#1)<>{$HYPERV.VM.EXPECTED.STATE:"{#VMID}"}
            and last(/NOMMA Hyper-V and Replica by Zabbix agent/hyperv.vm.state["{#VMID}"],#2)<>{$HYPERV.VM.EXPECTED.STATE:"{#VMID}"}'
          name: 'Hyper-V VM {#VMNAME}: Unexpected power state'
          priority: AVERAGE
          description: Set a context macro by VM ID to disable monitoring or change the expected state for intentionally stopped VMs.
          tags:
          - tag: scope
            value: health
          recovery_mode: RECOVERY_EXPRESSION
          recovery_expression: last(/NOMMA Hyper-V and Replica by Zabbix agent/hyperv.vm.state["{#VMID}"])={$HYPERV.VM.EXPECTED.STATE:"{#VMID}"} or {$HYPERV.VM.MONITOR:"{#VMID}"}=0
      - uuid: b6b8813fbd3848929a2f5cc60b7480c2
        name: 'VM {#VMNAME}: Health'
        type: DEPENDENT
        key: hyperv.vm.health["{#VMID}"]
        delay: '0'
        history: 30d
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.vms[?(@.id == "{#VMID}")].health.first()
        master_item:
          key: hyperv.collect
        tags:
        - tag: component
          value: vm
        - tag: scope
          value: health
        valuemap:
          name: NOMMA binary status
        trigger_prototypes:
        - uuid: 592748f9ca9445c7bd70228c97b4ef23
          expression: '{$HYPERV.VM.MONITOR:"{#VMID}"}=1 and last(/NOMMA Hyper-V and Replica by Zabbix agent/hyperv.collector.ok)=1 and last(/NOMMA Hyper-V and Replica
            by Zabbix agent/hyperv.service.vmms)=1 and min(/NOMMA Hyper-V and Replica by Zabbix agent/hyperv.vm.health["{#VMID}"],5m)=0'
          name: 'Hyper-V VM {#VMNAME}: Health is critical'
          priority: HIGH
          description: ''
          tags:
          - tag: scope
            value: availability
          recovery_mode: RECOVERY_EXPRESSION
          recovery_expression: last(/NOMMA Hyper-V and Replica by Zabbix agent/hyperv.vm.health["{#VMID}"])=1 or {$HYPERV.VM.MONITOR:"{#VMID}"}=0
      - uuid: 56f098cabe4b4ad5b87068e5ac0bd1c0
        name: 'VM {#VMNAME}: Heartbeat'
        type: DEPENDENT
        key: hyperv.vm.heartbeat["{#VMID}"]
        delay: '0'
        history: 30d
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.vms[?(@.id == "{#VMID}")].heartbeat.first()
        master_item:
          key: hyperv.collect
        tags:
        - tag: component
          value: vm
        - tag: scope
          value: health
        valuemap:
          name: NOMMA heartbeat status
        trigger_prototypes:
        - uuid: f573bb6e34ba49a2a07b4c3dcb46498e
          expression: '{$HYPERV.VM.MONITOR:"{#VMID}"}=1 and last(/NOMMA Hyper-V and Replica by Zabbix agent/hyperv.collector.ok)=1 and last(/NOMMA Hyper-V and Replica
            by Zabbix agent/hyperv.vm.state["{#VMID}"])=1 and max(/NOMMA Hyper-V and Replica by Zabbix agent/hyperv.vm.heartbeat["{#VMID}"],5m)=0'
          name: 'Hyper-V VM {#VMNAME}: Heartbeat is unavailable'
          priority: AVERAGE
          description: ''
          tags:
          - tag: scope
            value: health
          recovery_mode: RECOVERY_EXPRESSION
          recovery_expression: last(/NOMMA Hyper-V and Replica by Zabbix agent/hyperv.vm.heartbeat["{#VMID}"])=1 or last(/NOMMA Hyper-V and Replica by Zabbix agent/hyperv.vm.state["{#VMID}"])<>1
            or {$HYPERV.VM.MONITOR:"{#VMID}"}=0
      - uuid: 7e19446d07aa4fa9845b959c39cf4298
        name: 'VM {#VMNAME}: Uptime'
        type: DEPENDENT
        key: hyperv.vm.uptime["{#VMID}"]
        delay: '0'
        history: 30d
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.vms[?(@.id == "{#VMID}")].uptime_seconds.first()
        master_item:
          key: hyperv.collect
        tags:
        - tag: component
          value: vm
        - tag: scope
          value: health
        units: uptime
