---
# PaperCut MF TLS certificate lifecycle for a non-domain-joined Debian 12 host.
#
# Tags:
#   csr    - install OpenSSL, preserve/generate the private key, and create CSR
#   import - validate returned files, create/deploy PKCS#12, configure PaperCut,
#            restart only on change, and compare the served leaf certificate
#
# This playbook always runs from an Ansible controller. It never transfers the
# private key from the managed PaperCut host.
- name: Manage PaperCut MF AD CS TLS certificate
  hosts: papercut_mf
  become: true
  gather_facts: true

  vars:
    papercut_root: /home/papercut
    papercut_user: papercut
    papercut_group: papercut
    papercut_server_dir: "{{ papercut_root }}/server"
    papercut_ssl_dir: "{{ papercut_root }}/ssl"
    papercut_adcs_template: WebServer
    papercut_adcs_issuing_ca: issuing-ca.nomma.lan

    papercut_tls_key_path: "{{ papercut_ssl_dir }}/papercut-tls.key"
    papercut_tls_csr_path: "{{ papercut_ssl_dir }}/papercut-tls.csr"
    papercut_tls_openssl_config: "{{ papercut_ssl_dir }}/papercut-tls-openssl.cnf"
    # Copy these manually returned PEM files to these paths on the target.
    papercut_tls_leaf_path: "{{ papercut_ssl_dir }}/papercut-tls.crt"
    papercut_tls_ca_chain_path: "{{ papercut_ssl_dir }}/nomma-ca-chain.pem"
    papercut_tls_keystore_path: "{{ papercut_server_dir }}/custom/papercut-tls.p12"
    papercut_tls_keystore_relative_path: custom/papercut-tls.p12
    papercut_tls_keystore_alias: papercut
    papercut_server_properties_path: "{{ papercut_server_dir }}/server.properties"
    papercut_tls_keystore_stamp: "{{ papercut_ssl_dir }}/.papercut-tls-keystore.sha256"
    papercut_tls_password_stamp: "{{ papercut_ssl_dir }}/.papercut-tls-password.sha256"

  pre_tasks:
    - name: Assert Debian 12 target
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Debian'
          - ansible_distribution_major_version == '12'
        fail_msg: >-
          This workflow targets Debian 12. Detected
          {{ ansible_distribution }} {{ ansible_distribution_version }}.
      tags: [always]

    - name: Assert CSR DNS and IP SAN identity variables are set
      ansible.builtin.assert:
        that:
          - papercut_server_fqdn is defined
          - (papercut_server_fqdn | default('')) | length > 0
          - (papercut_server_fqdn | default('')) is match('^(?=.{1,253}$)(?:[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)+[A-Za-z]{2,63}$')
          - (papercut_server_ip | default('10.1.0.113')) is match('^(?:25[0-5]|2[0-4][0-9]|1?[0-9]{1,2})(?:\.(?:25[0-5]|2[0-4][0-9]|1?[0-9]{1,2})){3}$')
        fail_msg: >-
          Set a valid papercut_server_fqdn explicitly in inventory/group_vars or
          --extra-vars. papercut_server_ip defaults to 10.1.0.113 but may be overridden.
      tags: [csr]

    - name: Assert shared TLS SNI identity for import verification
      ansible.builtin.assert:
        that:
          - papercut_server_fqdn is defined
          - (papercut_server_fqdn | default('')) | length > 0
          - (papercut_server_fqdn | default('')) is match('^(?=.{1,253}$)(?:[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)+[A-Za-z]{2,63}$')
          - (papercut_ssl_port | default(9191) | string) is match('^[1-9][0-9]{0,4}$')
          - (papercut_ssl_port | default(9191) | int) <= 65535
        fail_msg: >-
          Import verifies the listener with TLS SNI. Set a valid
          papercut_server_fqdn explicitly; papercut_ssl_port defaults to 9191
          and may be overridden.
      tags: [import]

    - name: Assert Vault keystore secret is set for import
      ansible.builtin.assert:
        that:
          - papercut_keystore_password is defined
          - papercut_keystore_password | length >= 20
          - papercut_keystore_password != 'REPLACE_WITH_A_STRONG_UNIQUE_PASSWORD'
        fail_msg: >-
          Define a 20+-character papercut_keystore_password from an encrypted
          Ansible Vault file before running --tags import.
      no_log: true
      tags: [import]

  tasks:
    - name: Install OpenSSL
      ansible.builtin.apt:
        name: openssl
        state: present
        update_cache: true
        cache_valid_time: 3600
      tags: [csr, packages]

    - name: Create restricted TLS working directory
      ansible.builtin.file:
        path: "{{ papercut_ssl_dir }}"
        state: directory
        owner: "{{ papercut_user }}"
        group: "{{ papercut_group }}"
        mode: '0750'
      tags: [csr, import]

    - name: Check whether the private key already exists
      ansible.builtin.stat:
        path: "{{ papercut_tls_key_path }}"
      register: papercut_tls_key_stat
      tags: [csr]

    - name: Report CSR check-mode key and CSR creation
      ansible.builtin.debug:
        msg: >-
          Check mode: the missing server-local RSA-2048 private key and/or CSR
          would be created during a non-check CSR run; no cryptographic material
          is created or file permissions enforced for absent files in check mode.
      when: >-
        ansible_check_mode and
        (not papercut_tls_key_stat.stat.exists)
      changed_when: false
      tags: [csr]

    - name: Generate RSA 2048 private key only when absent
      ansible.builtin.command:
        argv:
          - openssl
          - genrsa
          - -out
          - "{{ papercut_tls_key_path }}"
          - '2048'
      when: not ansible_check_mode and not papercut_tls_key_stat.stat.exists
      changed_when: true
      no_log: true
      tags: [csr]

    - name: Enforce private-key ownership and permissions without replacing it
      ansible.builtin.file:
        path: "{{ papercut_tls_key_path }}"
        state: file
        owner: "{{ papercut_user }}"
        group: "{{ papercut_group }}"
        mode: '0600'
      when: not ansible_check_mode or papercut_tls_key_stat.stat.exists
      tags: [csr]

    - name: Write OpenSSL CSR configuration with required SANs and usages
      ansible.builtin.copy:
        dest: "{{ papercut_tls_openssl_config }}"
        owner: "{{ papercut_user }}"
        group: "{{ papercut_group }}"
        mode: '0640'
        content: |
          [ req ]
          default_bits = 2048
          prompt = no
          default_md = sha256
          distinguished_name = dn
          req_extensions = req_ext

          [ dn ]
          CN = {{ papercut_server_fqdn }}

          [ req_ext ]
          subjectAltName = @alt_names
          keyUsage = critical, digitalSignature, keyEncipherment
          extendedKeyUsage = serverAuth

          [ alt_names ]
          DNS.1 = {{ papercut_server_fqdn }}
          IP.1 = {{ papercut_server_ip | default('10.1.0.113') }}
      register: papercut_tls_openssl_config_result
      tags: [csr]

    - name: Check whether the CSR exists
      ansible.builtin.stat:
        path: "{{ papercut_tls_csr_path }}"
      register: papercut_tls_csr_stat
      tags: [csr]

    - name: Report CSR check-mode CSR generation
      ansible.builtin.debug:
        msg: >-
          Check mode: the CSR would be generated from the existing server-local
          private key because it is missing or its OpenSSL configuration changes.
      when: >-
        ansible_check_mode and
        (not papercut_tls_csr_stat.stat.exists or papercut_tls_openssl_config_result.changed)
      changed_when: false
      tags: [csr]

    - name: Generate CSR using the server-resident private key
      ansible.builtin.command:
        argv:
          - openssl
          - req
          - -new
          - -key
          - "{{ papercut_tls_key_path }}"
          - -out
          - "{{ papercut_tls_csr_path }}"
          - -config
          - "{{ papercut_tls_openssl_config }}"
      when: >-
        not ansible_check_mode and
        (not papercut_tls_csr_stat.stat.exists or
        papercut_tls_openssl_config_result.changed or
        not papercut_tls_key_stat.stat.exists)
      changed_when: true
      tags: [csr]

    - name: Enforce CSR ownership and permissions
      ansible.builtin.file:
        path: "{{ papercut_tls_csr_path }}"
        state: file
        owner: "{{ papercut_user }}"
        group: "{{ papercut_group }}"
        mode: '0644'
      when: not ansible_check_mode or papercut_tls_csr_stat.stat.exists
      tags: [csr]

    - name: Display non-interactive AD CS submission and return instructions
      ansible.builtin.debug:
        msg:
          - "CSR to copy to a domain-joined Windows computer: {{ papercut_tls_csr_path }}"
          - "Copy only the CSR; {{ papercut_tls_key_path }} never leaves this PaperCut host."
          - >-
            Windows: certreq -submit -attrib "CertificateTemplate:{{ papercut_adcs_template }}"
            papercut-tls.csr papercut-tls.cer
          - >-
            If needed, add -config "{{ papercut_adcs_issuing_ca }}\\CA-NAME" to avoid the CA picker.
          - >-
            Export the issuing CA and root CA chain separately as Base-64 PEM and return it as
            {{ papercut_tls_ca_chain_path }}. `certutil -ca.chain ca-chain.p7b` can retrieve
            the chain; convert a returned P7B on Debian with:
            openssl pkcs7 -print_certs -in ca-chain.p7b -out {{ papercut_tls_ca_chain_path }}
          - >-
            Copy the PEM leaf to {{ papercut_tls_leaf_path }} and the PEM CA chain to
            {{ papercut_tls_ca_chain_path }}, then run this playbook with --tags import.
      changed_when: false
      tags: [csr]

    - name: Check manually returned leaf certificate and CA chain
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ papercut_tls_leaf_path }}"
        - "{{ papercut_tls_ca_chain_path }}"
        - "{{ papercut_tls_key_path }}"
        - "{{ papercut_server_properties_path }}"
      register: papercut_tls_import_files
      tags: [import]

    - name: Assert import files and PaperCut configuration exist
      ansible.builtin.assert:
        that: item.stat.exists
        fail_msg: "Required import file/configuration is missing: {{ item.item }}"
      loop: "{{ papercut_tls_import_files.results }}"
      loop_control:
        label: "{{ item.item }}"
      tags: [import]

    - name: Explain import check-mode scope
      ansible.builtin.debug:
        msg: >-
          Check mode confirms required files are present and previews managed-file
          and server.properties changes only. It does not run OpenSSL validation,
          calculate input state, build/deploy PKCS#12, restart PaperCut, or probe TLS.
      when: ansible_check_mode
      changed_when: false
      tags: [import]

    - name: Validate returned leaf certificate parses as PEM X.509
      ansible.builtin.command:
        argv: [openssl, x509, -in, "{{ papercut_tls_leaf_path }}", -noout]
      changed_when: false
      when: not ansible_check_mode
      tags: [import]

    - name: Validate returned CA chain parses as PEM certificates
      ansible.builtin.command:
        argv: [openssl, crl2pkcs7, -nocrl, -certfile, "{{ papercut_tls_ca_chain_path }}", -outform, PEM]
      changed_when: false
      when: not ansible_check_mode
      tags: [import]

    - name: Read private-key modulus
      ansible.builtin.command:
        argv: [openssl, rsa, -noout, -modulus, -in, "{{ papercut_tls_key_path }}"]
      register: papercut_tls_key_modulus
      changed_when: false
      no_log: true
      when: not ansible_check_mode
      tags: [import]

    - name: Read leaf-certificate modulus
      ansible.builtin.command:
        argv: [openssl, x509, -noout, -modulus, -in, "{{ papercut_tls_leaf_path }}"]
      register: papercut_tls_leaf_modulus
      changed_when: false
      when: not ansible_check_mode
      tags: [import]

    - name: Assert returned leaf matches the preserved private key
      ansible.builtin.assert:
        that: papercut_tls_key_modulus.stdout == papercut_tls_leaf_modulus.stdout
        fail_msg: >-
          Returned leaf certificate does not match the server-resident private key.
          Do not deploy it; generate a new CSR from the preserved key and reissue.
      no_log: true
      when: not ansible_check_mode
      tags: [import]

    - name: Validate returned leaf against returned CA chain
      ansible.builtin.command:
        argv: [openssl, verify, -CAfile, "{{ papercut_tls_ca_chain_path }}", "{{ papercut_tls_leaf_path }}"]
      changed_when: false
      when: not ansible_check_mode
      tags: [import]

    - name: Calculate non-secret certificate input fingerprint
      ansible.builtin.command:
        argv: [sha256sum, "{{ papercut_tls_key_path }}", "{{ papercut_tls_leaf_path }}", "{{ papercut_tls_ca_chain_path }}"]
      register: papercut_tls_input_fingerprint
      changed_when: false
      no_log: true
      when: not ansible_check_mode
      tags: [import]

    - name: Check deployed PKCS#12 keystore and activation stamps
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ papercut_tls_keystore_path }}"
        - "{{ papercut_tls_keystore_stamp }}"
        - "{{ papercut_tls_password_stamp }}"
      register: papercut_tls_activation_files
      tags: [import]

    - name: Read existing activation stamps
      ansible.builtin.slurp:
        src: "{{ item.item }}"
      loop: "{{ papercut_tls_activation_files.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: not ansible_check_mode and item.stat.exists
      register: papercut_tls_activation_stamp_contents
      no_log: true
      tags: [import]

    - name: Determine whether a replacement PKCS#12 is required
      ansible.builtin.set_fact:
        papercut_tls_keystore_rebuild_required: >-
          {{
            not papercut_tls_activation_files.results[0].stat.exists or
            not papercut_tls_activation_files.results[1].stat.exists or
            not papercut_tls_activation_files.results[2].stat.exists or
            (papercut_tls_activation_stamp_contents.results[1].content | default('') | b64decode) != (papercut_tls_input_fingerprint.stdout + '\n') or
            (papercut_tls_activation_stamp_contents.results[2].content | default('') | b64decode) != ((papercut_keystore_password | hash('sha256')) + '\n')
          }}
      when: not ansible_check_mode
      no_log: true
      tags: [import]

    - name: Remove an abandoned replacement PKCS#12 before rebuilding
      ansible.builtin.file:
        path: "{{ papercut_tls_keystore_path }}.new"
        state: absent
      when: not ansible_check_mode and papercut_tls_keystore_rebuild_required | bool
      tags: [import]

    - name: Build replacement PKCS#12 keystore from leaf, chain, and local key
      ansible.builtin.command:
        argv:
          - openssl
          - pkcs12
          - -export
          - -in
          - "{{ papercut_tls_leaf_path }}"
          - -certfile
          - "{{ papercut_tls_ca_chain_path }}"
          - -inkey
          - "{{ papercut_tls_key_path }}"
          - -name
          - "{{ papercut_tls_keystore_alias }}"
          - -out
          - "{{ papercut_tls_keystore_path }}.new"
          - -passout
          - stdin
        stdin: "{{ papercut_keystore_password }}"
        stdin_add_newline: true
      when: not ansible_check_mode and papercut_tls_keystore_rebuild_required | bool
      register: papercut_tls_keystore_build
      changed_when: true
      no_log: true
      tags: [import]

    - name: Secure replacement PKCS#12 before activation # noqa no-handler
      ansible.builtin.file:
        path: "{{ papercut_tls_keystore_path }}.new"
        state: file
        owner: "{{ papercut_user }}"
        group: "{{ papercut_group }}"
        mode: '0600'
      when: papercut_tls_keystore_build.changed | default(false)
      tags: [import]

    - name: Atomically activate the replacement PKCS#12 keystore # noqa no-handler
      ansible.builtin.command:
        argv: [mv, "{{ papercut_tls_keystore_path }}.new", "{{ papercut_tls_keystore_path }}"]
      when: papercut_tls_keystore_build.changed | default(false)
      changed_when: true
      notify: Restart PaperCut MF
      tags: [import]

    - name: Record certificate input fingerprint after successful activation # noqa no-handler
      ansible.builtin.copy:
        dest: "{{ papercut_tls_keystore_stamp }}"
        content: "{{ papercut_tls_input_fingerprint.stdout }}\n"
        owner: root
        group: "{{ papercut_group }}"
        mode: '0640'
      when: papercut_tls_keystore_build.changed | default(false)
      no_log: true
      tags: [import]

    - name: Record keystore-password fingerprint after successful activation # noqa no-handler
      ansible.builtin.copy:
        dest: "{{ papercut_tls_password_stamp }}"
        content: "{{ papercut_keystore_password | hash('sha256') }}\n"
        owner: root
        group: "{{ papercut_group }}"
        mode: '0640'
      when: papercut_tls_keystore_build.changed | default(false)
      no_log: true
      tags: [import]

    - name: Secure deployed PKCS#12 keystore
      ansible.builtin.file:
        path: "{{ papercut_tls_keystore_path }}"
        state: file
        owner: "{{ papercut_user }}"
        group: "{{ papercut_group }}"
        mode: '0600'
      when: >-
        papercut_tls_activation_files.results[0].stat.exists or
        papercut_tls_keystore_build.changed | default(false)
      tags: [import]

    # PaperCut reads a server-root-relative path from server.properties.
    - name: Configure PaperCut PKCS#12 path
      ansible.builtin.lineinfile:
        path: "{{ papercut_server_properties_path }}"
        regexp: '^server\.keystore\.path='
        line: "server.keystore.path={{ papercut_tls_keystore_relative_path }}"
        owner: "{{ papercut_user }}"
        group: "{{ papercut_group }}"
        mode: '0600'
      notify: Restart PaperCut MF
      tags: [import]

    - name: Configure PaperCut PKCS#12 password
      ansible.builtin.lineinfile:
        path: "{{ papercut_server_properties_path }}"
        regexp: '^server\.keystore\.password='
        line: "server.keystore.password={{ papercut_keystore_password }}"
        owner: "{{ papercut_user }}"
        group: "{{ papercut_group }}"
        mode: '0600'
      no_log: true
      notify: Restart PaperCut MF
      tags: [import]

    - name: Configure PaperCut PKCS#12 keystore type
      ansible.builtin.lineinfile:
        path: "{{ papercut_server_properties_path }}"
        regexp: '^server\.keystore\.type='
        line: 'server.keystore.type=PKCS12'
        owner: "{{ papercut_user }}"
        group: "{{ papercut_group }}"
        mode: '0600'
      notify: Restart PaperCut MF
      tags: [import]

    - name: Configure PaperCut TLS port
      ansible.builtin.lineinfile:
        path: "{{ papercut_server_properties_path }}"
        regexp: '^server\.port\.ssl='
        line: "server.port.ssl={{ papercut_ssl_port | default(9191) }}"
        owner: "{{ papercut_user }}"
        group: "{{ papercut_group }}"
        mode: '0600'
      notify: Restart PaperCut MF
      tags: [import]

    - name: Apply PaperCut changes before certificate verification
      ansible.builtin.meta: flush_handlers
      when: not ansible_check_mode
      tags: [import]

    - name: Wait for PaperCut TLS listener after a changed import
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ papercut_ssl_port | default(9191) | int }}"
        delay: 1
        timeout: 90
        connect_timeout: 5
        state: started
      when: not ansible_check_mode
      tags: [import]

    - name: Read expected leaf serial and SHA-256 fingerprint
      ansible.builtin.command:
        argv: [openssl, x509, -in, "{{ papercut_tls_leaf_path }}", -noout, -serial, -fingerprint, -sha256]
      register: papercut_tls_expected_leaf
      changed_when: false
      when: not ansible_check_mode
      tags: [import]

    - name: Read leaf certificate currently served on the configured localhost TLS port
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail &&
          openssl s_client -connect 127.0.0.1:{{ papercut_ssl_port | default(9191) | int }}
          -servername {{ papercut_server_fqdn }} </dev/null 2>/dev/null |
          openssl x509 -noout -serial -fingerprint -sha256
        executable: /bin/bash
      register: papercut_tls_served_leaf
      changed_when: false
      until: papercut_tls_served_leaf.rc == 0 and papercut_tls_served_leaf.stdout | length > 0
      retries: 6
      delay: 5
      when: not ansible_check_mode
      tags: [import]

    - name: Assert PaperCut serves the imported leaf certificate
      ansible.builtin.assert:
        that:
          - papercut_tls_expected_leaf.stdout_lines | sort == papercut_tls_served_leaf.stdout_lines | sort
        fail_msg: >-
          Configured TLS port {{ papercut_ssl_port | default(9191) }} did not serve the imported leaf certificate.
          Inspect {{ papercut_server_properties_path }}, service {{ papercut_service_name | default('papercut') }},
          and PaperCut logs before retrying.
      when: not ansible_check_mode
      tags: [import]

  handlers:
    - name: Restart PaperCut MF
      ansible.builtin.systemd:
        name: "{{ papercut_service_name | default('papercut') }}"
        state: restarted
      when: not ansible_check_mode
