---
- name: Read local SSH public key from control node
  ansible.builtin.set_fact:
    ssh_setup_admin_public_key: "{{ lookup('ansible.builtin.file', ssh_public_key_path) }}"
  no_log: true

- name: Ensure admin .ssh directory exists
  ansible.builtin.file:
    path: "/home/{{ admin_user }}/.ssh"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_group }}"
    mode: "0700"

- name: Install admin authorized SSH key
  ansible.posix.authorized_key:
    user: "{{ admin_user }}"
    key: "{{ ssh_setup_admin_public_key }}"
    state: present
    manage_dir: false
  no_log: true

- name: Ensure authorized_keys has secure permissions
  ansible.builtin.file:
    path: "/home/{{ admin_user }}/.ssh/authorized_keys"
    state: file
    owner: "{{ admin_user }}"
    group: "{{ admin_group }}"
    mode: "0600"
