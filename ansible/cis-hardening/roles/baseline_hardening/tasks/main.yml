---
# roles/baseline_hardening/tasks/main.yml
#
# Baseline Linux hardening for NOMMA Debian/Ubuntu hosts.
# Installs packages, removes insecure packages, creates admin users,
# deploys SSH keys, grants sudo, and enables security services.

# ──────────────────────────────────────────────────────────
# Package installation
# ──────────────────────────────────────────────────────────

- name: Update apt package cache
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install baseline security and operational packages
  ansible.builtin.apt:
    name: "{{ baseline_packages }}"
    state: present

- name: Remove insecure telnet packages
  ansible.builtin.apt:
    name: "{{ baseline_packages_remove }}"
    state: absent
    purge: yes

# ──────────────────────────────────────────────────────────
# User creation
# ──────────────────────────────────────────────────────────

- name: Create admin users with home directory and bash shell
  ansible.builtin.user:
    name: "{{ item.username }}"
    shell: "{{ item.shell }}"
    create_home: yes
    state: present
  loop: "{{ admin_users }}"

- name: Set password for admin users
  ansible.builtin.user:
    name: "{{ item.username }}"
    password: "{{ admin_password_hash }}"
  loop: "{{ admin_users }}"
  no_log: true

# ──────────────────────────────────────────────────────────
# SSH key deployment
# ──────────────────────────────────────────────────────────

- name: Ensure .ssh directory exists for admin users
  ansible.builtin.file:
    path: "/home/{{ item.username }}/.ssh"
    state: directory
    owner: "{{ item.username }}"
    group: "{{ item.username }}"
    mode: "0700"
  loop: "{{ admin_users }}"
  when: item.ssh_key | length > 0

- name: Deploy SSH public key for admin users
  ansible.builtin.copy:
    dest: "/home/{{ item.username }}/.ssh/authorized_keys"
    content: "{{ item.ssh_key }}\n"
    owner: "{{ item.username }}"
    group: "{{ item.username }}"
    mode: "0600"
  loop: "{{ admin_users }}"
  when: item.ssh_key | length > 0
  no_log: true

# ──────────────────────────────────────────────────────────
# Sudo access
# ──────────────────────────────────────────────────────────

- name: Add admin users to sudo group
  ansible.builtin.user:
    name: "{{ item.username }}"
    groups: sudo
    append: yes
  loop: "{{ admin_users }}"

- name: Ensure sudo group requires a password for sudo
  ansible.builtin.copy:
    dest: /etc/sudoers.d/sudo-group-require-pass
    content: "%sudo ALL=(ALL:ALL) ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: 'visudo -cf %s'

# ──────────────────────────────────────────────────────────
# Service enablement
# ──────────────────────────────────────────────────────────

- name: Validate selected time synchronization service
  ansible.builtin.assert:
    that:
      - baseline_time_sync_service in ['chrony', 'systemd-timesyncd']
    fail_msg: "baseline_time_sync_service must be either 'chrony' or 'systemd-timesyncd'."
    quiet: true

- name: Ensure AppArmor is enabled and running
  ansible.builtin.systemd:
    name: apparmor
    state: started
    enabled: yes

- name: Ensure fail2ban is enabled and running
  ansible.builtin.systemd:
    name: fail2ban
    state: started
    enabled: yes

- name: Ensure rsyslog is enabled and running
  ansible.builtin.systemd:
    name: rsyslog
    state: started
    enabled: yes

- name: Ensure auditd is enabled and running
  ansible.builtin.systemd:
    name: auditd
    state: started
    enabled: yes

- name: Ensure unattended-upgrades timer is enabled
  ansible.builtin.systemd:
    name: apt-daily.timer
    state: started
    enabled: yes

# Description:
#   The chrony package is installed with a dedicated user account _chrony. This
#   account is granted the access required by the chronyd service.
#
# Rationale:
#   The chronyd service should run with only the required privileges.
#
# Remediation:
#   Add or edit the user line to /etc/chrony/chrony.conf or a file ending in
#   .conf in /etc/chrony/conf.d/:
#     user _chrony
#   OR if another time synchronization service is in use, remove chrony:
#     apt purge chrony
#     apt autoremove chrony
#
# CIS checks (condition: all):
#   Directory /etc/chrony/conf.d/ exists
#   Any .conf file in /etc/chrony/conf.d/ contains: user\s*_chrony
#   /etc/chrony/chrony.conf contains: user\s*_chrony
- name: Ensure chrony conf.d directory exists when chrony is selected
  ansible.builtin.file:
    path: "{{ baseline_chrony_conf_d_path }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: baseline_time_sync_service == 'chrony'

- name: Ensure chrony runs as the dedicated chrony user
  ansible.builtin.lineinfile:
    path: "{{ baseline_chrony_config_path }}"
    regexp: '^\s*user\s+'
    line: "user {{ baseline_chrony_user }}"
    owner: root
    group: root
    mode: "0644"
    create: yes
  notify: Restart chrony
  when: baseline_time_sync_service == 'chrony'

- name: Ensure chrony conf.d has CIS user control
  ansible.builtin.lineinfile:
    path: "{{ baseline_chrony_conf_d_user_config_path }}"
    regexp: '^\s*user\s+'
    line: "user {{ baseline_chrony_user }}"
    owner: root
    group: root
    mode: "0644"
    create: yes
  notify: Restart chrony
  when: baseline_time_sync_service == 'chrony'

- name: Ensure chrony is enabled and running
  ansible.builtin.systemd:
    name: chrony
    state: started
    enabled: yes
  when: baseline_time_sync_service == 'chrony'

- name: Remove chrony when another time synchronization service is selected
  ansible.builtin.apt:
    name: chrony
    state: absent
    purge: yes
    autoremove: "{{ baseline_chrony_autoremove }}"
  when: baseline_time_sync_service != 'chrony'

# Description:
#   systemd-timesyncd is a daemon that has been added for synchronizing the
#   system clock across the network.
#
# Rationale:
#   systemd-timesyncd needs to be enabled and running in order to synchronize
#   the system to a timeserver. Time synchronization is important to support
#   time sensitive security mechanisms and to ensure log files have consistent
#   time records across the enterprise to aid in forensic investigations.
#
# Remediation:
#   IF systemd-timesyncd is in use on the system, run:
#     systemctl unmask systemd-timesyncd.service
#     systemctl --now enable systemd-timesyncd.service
#   OR if another time synchronization service is in use, run:
#     systemctl --now mask systemd-timesyncd.service
#
# CIS checks:
#   systemctl is-active systemd-timesyncd.service -> active
#   systemctl is-enabled systemd-timesyncd.service -> enabled
- name: Ensure systemd-timesyncd package is installed when selected
  ansible.builtin.apt:
    name: systemd-timesyncd
    state: present
  when: baseline_time_sync_service == 'systemd-timesyncd'

- name: Ensure systemd-timesyncd is unmasked when selected
  ansible.builtin.systemd:
    name: "{{ baseline_systemd_timesyncd_service }}"
    masked: no
  when: baseline_time_sync_service == 'systemd-timesyncd'

- name: Ensure systemd-timesyncd is enabled and running when selected
  ansible.builtin.systemd:
    name: "{{ baseline_systemd_timesyncd_service }}"
    state: started
    enabled: yes
  when: baseline_time_sync_service == 'systemd-timesyncd'

- name: Verify systemd-timesyncd is active when selected
  ansible.builtin.command: systemctl is-active systemd-timesyncd.service
  register: timesyncd_active_check
  changed_when: false
  failed_when: false
  when: baseline_time_sync_service == 'systemd-timesyncd'

- name: Assert systemd-timesyncd is active when selected
  ansible.builtin.assert:
    that:
      - timesyncd_active_check.stdout | trim == 'active'
    fail_msg: "systemd-timesyncd.service is not active."
    success_msg: "systemd-timesyncd.service is active."
  when: baseline_time_sync_service == 'systemd-timesyncd'

- name: Verify systemd-timesyncd is enabled when selected
  ansible.builtin.command: systemctl is-enabled systemd-timesyncd.service
  register: timesyncd_enabled_check
  changed_when: false
  failed_when: false
  when: baseline_time_sync_service == 'systemd-timesyncd'

- name: Assert systemd-timesyncd is enabled when selected
  ansible.builtin.assert:
    that:
      - timesyncd_enabled_check.stdout | trim == 'enabled'
    fail_msg: "systemd-timesyncd.service is not enabled."
    success_msg: "systemd-timesyncd.service is enabled."
  when: baseline_time_sync_service == 'systemd-timesyncd'

- name: Check if systemd-timesyncd service exists
  ansible.builtin.command: systemctl cat systemd-timesyncd.service
  register: timesyncd_service_check
  changed_when: false
  failed_when: false

- name: Ensure systemd-timesyncd is masked when another time service is selected
  ansible.builtin.systemd:
    name: "{{ baseline_systemd_timesyncd_service }}"
    state: stopped
    enabled: no
    masked: yes
  when:
    - baseline_time_sync_service != 'systemd-timesyncd'
    - timesyncd_service_check.rc == 0
