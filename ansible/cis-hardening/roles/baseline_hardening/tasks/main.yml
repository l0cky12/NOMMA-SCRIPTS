---
# roles/baseline_hardening/tasks/main.yml
#
# Baseline Linux hardening for NOMMA Debian/Ubuntu hosts.
# Installs packages, removes insecure packages, creates admin users,
# deploys SSH keys, grants sudo, and enables security services.

# ──────────────────────────────────────────────────────────
# Package installation
# ──────────────────────────────────────────────────────────

- name: Update apt package cache
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install baseline security and operational packages
  ansible.builtin.apt:
    name: "{{ baseline_packages }}"
    state: present

- name: Remove insecure packages (telnet client)
  ansible.builtin.apt:
    name: "{{ baseline_packages_remove }}"
    state: absent
    purge: yes

# ──────────────────────────────────────────────────────────
# User creation
# ──────────────────────────────────────────────────────────

- name: Create admin users with home directory and bash shell
  ansible.builtin.user:
    name: "{{ item.username }}"
    shell: "{{ item.shell }}"
    create_home: yes
    state: present
  loop: "{{ admin_users }}"

- name: Set password for admin users
  ansible.builtin.user:
    name: "{{ item.username }}"
    password: "{{ admin_password_hash }}"
  loop: "{{ admin_users }}"
  no_log: true

# ──────────────────────────────────────────────────────────
# SSH key deployment
# ──────────────────────────────────────────────────────────

- name: Ensure .ssh directory exists for admin users
  ansible.builtin.file:
    path: "/home/{{ item.username }}/.ssh"
    state: directory
    owner: "{{ item.username }}"
    group: "{{ item.username }}"
    mode: "0700"
  loop: "{{ admin_users }}"
  when: item.ssh_key | length > 0

- name: Deploy SSH public key for admin users
  ansible.builtin.copy:
    dest: "/home/{{ item.username }}/.ssh/authorized_keys"
    content: "{{ item.ssh_key }}\n"
    owner: "{{ item.username }}"
    group: "{{ item.username }}"
    mode: "0600"
  loop: "{{ admin_users }}"
  when: item.ssh_key | length > 0
  no_log: true

# ──────────────────────────────────────────────────────────
# Sudo access
# ──────────────────────────────────────────────────────────

- name: Add admin users to sudo group
  ansible.builtin.user:
    name: "{{ item.username }}"
    groups: sudo
    append: yes
  loop: "{{ admin_users }}"

- name: Ensure sudo group has passwordless sudo (NOPASSWD)
  ansible.builtin.copy:
    dest: /etc/sudoers.d/sudo-group-nopasswd
    content: "%sudo ALL=(ALL) NOPASSWD: ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: 'visudo -cf %s'

# ──────────────────────────────────────────────────────────
# Service enablement
# ──────────────────────────────────────────────────────────

- name: Ensure AppArmor is enabled and running
  ansible.builtin.systemd:
    name: apparmor
    state: started
    enabled: yes

- name: Ensure fail2ban is enabled and running
  ansible.builtin.systemd:
    name: fail2ban
    state: started
    enabled: yes

- name: Ensure rsyslog is enabled and running
  ansible.builtin.systemd:
    name: rsyslog
    state: started
    enabled: yes

- name: Ensure auditd is enabled and running
  ansible.builtin.systemd:
    name: auditd
    state: started
    enabled: yes

- name: Ensure unattended-upgrades timer is enabled
  ansible.builtin.systemd:
    name: apt-daily.timer
    state: started
    enabled: yes

- name: Ensure chrony is enabled and running
  ansible.builtin.systemd:
    name: chrony
    state: started
    enabled: yes