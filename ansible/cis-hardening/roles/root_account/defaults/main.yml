---
# roles/root_account/defaults/main.yml
#
# CIS 6.1.2 - Ensure root account access is controlled
# Sets a random password on the root account and locks it from
# direct console login. Admin users escalate via sudo.

# Whether to generate a new random root password on each run.
# If true, a new passphrase is generated and set.
# If false, the existing password is left unchanged.
root_account_set_password: true

# Whether to lock the root password (passwd -l root).
# CIS recommends locking the root account when sudo is configured.
# A locked password means 'su -' requires the password but it's
# impossible to brute-force. The account can still be su'd to via
# sudo (which doesn't need the password).
root_account_lock: true

# Path to /etc/passwd for verification
root_account_passwd_file: /etc/passwd

# Wordlist for passphrase generation (Word-Word-Word-Number format)
root_account_wordlist:
