---
# roles/ssh_maxstartups/tasks/main.yml
#
# CIS 5.2.15 - Ensure SSH MaxStartups is configured
#
# Sets MaxStartups in sshd_config above any Include/Match entries
# (first occurrence takes precedence). Rate-limits unauthenticated
# SSH connections to prevent denial-of-service from connection floods.
#
# Idempotent: uses ansible.builtin.lineinfile with regexp match.
# Safe to rerun.

# ──────────────────────────────────────────────────────────
# Pre-flight: verify sshd_config exists
# ──────────────────────────────────────────────────────────

- name: Check if sshd_config exists
  ansible.builtin.stat:
    path: "{{ ssh_maxstartups_sshd_config }}"
  register: ssh_maxstartups_sshd_stat

- name: Fail if sshd_config not found
  ansible.builtin.assert:
    that:
      - ssh_maxstartups_sshd_stat.stat.exists
    fail_msg: >-
      {{ ssh_maxstartups_sshd_config }} not found. Ensure openssh-server is installed.
    success_msg: "sshd_config found at {{ ssh_maxstartups_sshd_config }}."

# ──────────────────────────────────────────────────────────
# Configure MaxStartups (above Include/Match)
# ──────────────────────────────────────────────────────────

- name: Set MaxStartups in sshd_config
  ansible.builtin.lineinfile:
    path: "{{ ssh_maxstartups_sshd_config }}"
    regexp: '^\s*#?\s*MaxStartups\s+.*$'
    line: "MaxStartups {{ ssh_maxstartups_value }}"
    insertbefore: '^\s*(Include|Match)\s'
    state: present
    backup: yes
    validate: 'sshd -t -f %s'
  notify: Reload sshd

# ──────────────────────────────────────────────────────────
# Flush handlers so sshd reloads before verification
# ──────────────────────────────────────────────────────────

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

# ──────────────────────────────────────────────────────────
# Verification
# ──────────────────────────────────────────────────────────

- name: Read sshd_config for MaxStartups verification
  ansible.builtin.command: grep -i '^MaxStartups' {{ ssh_maxstartups_sshd_config }}
  register: ssh_maxstartups_check
  changed_when: false
  failed_when: false

- name: Verify MaxStartups directive is set
  ansible.builtin.assert:
    that:
      - "'MaxStartups' in ssh_maxstartups_check.stdout"
    fail_msg: >-
      MaxStartups directive not found in {{ ssh_maxstartups_sshd_config }}.
      Run: grep -i '^MaxStartups' {{ ssh_maxstartups_sshd_config }}
    success_msg: "MaxStartups directive is present in sshd_config."

- name: Verify MaxStartups value matches configured value
  ansible.builtin.assert:
    that:
      - "ssh_maxstartups_value in ssh_maxstartups_check.stdout"
    fail_msg: >-
      MaxStartups not set to '{{ ssh_maxstartups_value }}' in {{ ssh_maxstartups_sshd_config }}.
      Current value: {{ ssh_maxstartups_check.stdout }}
    success_msg: "MaxStartups set to '{{ ssh_maxstartups_value }}'."

- name: Verify effective SSH config via sshd -T
  ansible.builtin.command: sshd -T -f {{ ssh_maxstartups_sshd_config }}
  register: ssh_maxstartups_effective
  changed_when: false
  failed_when: false

- name: Verify effective MaxStartups matches configured value
  ansible.builtin.assert:
    that:
      - "ssh_maxstartups_value in ssh_maxstartups_effective.stdout"
    fail_msg: >-
      Effective MaxStartups does not match '{{ ssh_maxstartups_value }}'.
      Run: sshd -T -f {{ ssh_maxstartups_sshd_config }} | grep -i maxstartups
    success_msg: "Effective MaxStartups matches '{{ ssh_maxstartups_value }}'."
  when: ssh_maxstartups_effective.rc == 0

- name: Report SSH MaxStartups status
  ansible.builtin.debug:
    msg: >-
      SSH MaxStartups configured to '{{ ssh_maxstartups_value }}'
      (10 start, 30% drop rate, 60 full drop).
