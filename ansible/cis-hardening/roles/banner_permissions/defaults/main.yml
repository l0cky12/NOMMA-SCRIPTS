---
# roles/banner_permissions/defaults/main.yml
#
# CIS 1.7.1 - Ensure access to /etc/issue is configured
# CIS 1.7.2 - Ensure access to /etc/issue.net is configured
#
# Description:
#   The contents of /etc/issue are displayed to users prior to login for
#   local terminals. The contents of /etc/issue.net are displayed prior to
#   login for remote terminals.
#
# Rationale:
#   If these files do not have the correct access configured, they could be
#   modified by unauthorized users with incorrect or misleading information.
#
# Remediation:
#   Run the following commands to set mode, owner, and group on each file:
#     chown root:root $(readlink -e /etc/issue)
#     chmod u-x,go-wx $(readlink -e /etc/issue)
#     chown root:root $(readlink -e /etc/issue.net)
#     chmod u-x,go-wx $(readlink -e /etc/issue.net)
#
# CIS check:
#   stat -L "%n %a %u %U %g %G" /etc/issue ->
#   owner=root group=root mode=644|640|600|400

# ── Files to harden ──────────────────────────────────────────
banner_perms_files:
  - /etc/issue
  - /etc/issue.net

# ── Owner and group ──────────────────────────────────────────
banner_perms_owner: root
banner_perms_group: root

# ── File mode ───────────────────────────────────────────────
# CIS accepts: 644, 640, 600, 400
# 0644 is the most common (readable by all, writable by root only)
banner_perms_mode: "0644"

# ── Acceptable modes per CIS check ──────────────────────────
banner_perms_acceptable_modes:
  - "0644"
  - "0640"
  - "0600"
  - "0400"