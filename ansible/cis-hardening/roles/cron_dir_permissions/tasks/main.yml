---
# roles/cron_dir_permissions/tasks/main.yml
#
# CIS - Ensure permissions on cron directories are configured
#
# Sets owner root:root and mode 0700 on all cron subdirectories
# (/etc/cron.hourly, daily, weekly, monthly, cron.d) to prevent
# unprivileged users from reading or modifying system cron jobs.
#
# Idempotent: ansible.builtin.file only changes when state differs.

# ──────────────────────────────────────────────────────────
# Pre-flight: check which cron directories exist
# ──────────────────────────────────────────────────────────

- name: Check if cron directories exist
  ansible.builtin.stat:
    path: "{{ item }}"
  register: cron_dir_stat
  loop: "{{ cron_dir_permissions_dirs }}"

# ──────────────────────────────────────────────────────────
# Set owner, group, and mode on existing directories
# ──────────────────────────────────────────────────────────

- name: Set root:root ownership and 0700 on cron directories
  ansible.builtin.file:
    path: "{{ item.item }}"
    owner: "{{ cron_dir_permissions_owner }}"
    group: "{{ cron_dir_permissions_group }}"
    mode: "{{ cron_dir_permissions_mode }}"
    state: directory
  loop: "{{ cron_dir_stat.results }}"
  when: item.stat.exists

# ──────────────────────────────────────────────────────────
# Verification: re-stat and validate against CIS check
# ──────────────────────────────────────────────────────────

- name: Re-stat cron directories after changes
  ansible.builtin.stat:
    path: "{{ item }}"
  register: cron_dir_post_stat
  loop: "{{ cron_dir_permissions_dirs }}"

- name: Verify cron directories exist
  ansible.builtin.assert:
    that:
      - item.stat.exists
    fail_msg: "{{ item.item }} does not exist after hardening. Cron may not be installed."
    success_msg: "{{ item.item }} exists"
  loop: "{{ cron_dir_post_stat.results }}"

- name: Verify cron directories owner is root
  ansible.builtin.assert:
    that:
      - item.stat.pw_name == cron_dir_permissions_owner
    fail_msg: "{{ item.item }} owner is {{ item.stat.pw_name }}, expected {{ cron_dir_permissions_owner }}"
    success_msg: "{{ item.item }} owner is root"
  loop: "{{ cron_dir_post_stat.results }}"

- name: Verify cron directories group is root
  ansible.builtin.assert:
    that:
      - item.stat.gr_name == cron_dir_permissions_group
    fail_msg: "{{ item.item }} group is {{ item.stat.gr_name }}, expected {{ cron_dir_permissions_group }}"
    success_msg: "{{ item.item }} group is root"
  loop: "{{ cron_dir_post_stat.results }}"

- name: Verify cron directories mode is 0700
  ansible.builtin.assert:
    that:
      - item.stat.mode == cron_dir_permissions_mode
    fail_msg: "{{ item.item }} mode is {{ item.stat.mode }}, expected {{ cron_dir_permissions_mode }}"
    success_msg: "{{ item.item }} mode is 0700 (owner access only)"
  loop: "{{ cron_dir_post_stat.results }}"

- name: Report cron directories final state
  ansible.builtin.debug:
    msg: >-
      {{ item.item }}: owner={{ item.stat.pw_name }}
      group={{ item.stat.gr_name }}
      mode={{ item.stat.mode }}
  loop: "{{ cron_dir_post_stat.results }}"