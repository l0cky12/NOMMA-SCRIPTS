---
# roles/motd_permissions/defaults/main.yml
#
# CIS 1.6.4 - Ensure permissions on /etc/motd are configured
#
# Description:
#   The contents of the /etc/motd file are displayed to users after login and
#   function as a message of the day for authenticated users.
#
# Rationale:
#   If /etc/motd does not have the correct access configured, it could be
#   modified by unauthorized users with incorrect or misleading information.
#
# Remediation:
#   Run the following commands to set mode, owner, and group on /etc/motd:
#     chown root:root $(readlink -e /etc/motd)
#     chmod u-x,go-wx $(readlink -e /etc/motd)
#   -OR- remove the file:
#     rm /etc/motd

# Path to the MOTD file (resolves symlinks at runtime)
motd_perms_file: /etc/motd

# Whether to enforce the file (true) or remove it (false).
# CIS accepts either: correct permissions OR absent.
motd_perms_ensure_present: true

# Owner and group for /etc/motd
motd_perms_owner: root
motd_perms_group: root

# File mode — remediation specifies u-x,go-wx, which equals 0644 for a file
motd_perms_mode: "0644"

# Whether to create /etc/motd if it is missing. Set to false for strict CIS
# remediation behavior, which only enforces permissions on an existing file
# or removes it; creation of MOTD content belongs in the motd_hardening role.
motd_perms_create_if_missing: false