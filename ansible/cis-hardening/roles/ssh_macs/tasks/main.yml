---
# roles/ssh_macs/tasks/main.yml
#
# CIS 5.2.14 - Ensure weak MAC algorithms are removed
#
# Excludes weak MAC algorithms from sshd by setting a MACs line
# with the '-' prefix for each weak algorithm. The line is placed
# above any Include/Match entries (first occurrence takes precedence).
#
# This mitigates SSH downgrade attacks where an attacker forces
# negotiation of weak MACs (MD5, 96-bit, etc.) to facilitate MiTM.
#
# Idempotent: uses ansible.builtin.lineinfile with regexp match.
# Safe to rerun.

# ──────────────────────────────────────────────────────────
# Pre-flight: verify sshd_config exists
# ──────────────────────────────────────────────────────────

- name: Check if sshd_config exists
  ansible.builtin.stat:
    path: "{{ ssh_macs_sshd_config }}"
  register: ssh_macs_sshd_stat

- name: Fail if sshd_config not found
  ansible.builtin.assert:
    that:
      - ssh_macs_sshd_stat.stat.exists
    fail_msg: >-
      {{ ssh_macs_sshd_config }} not found. Ensure openssh-server is installed.
    success_msg: "sshd_config found at {{ ssh_macs_sshd_config }}."

# ──────────────────────────────────────────────────────────
# Build the MACs exclusion line and apply it
# ──────────────────────────────────────────────────────────

# OpenSSH MACs removal syntax: single '-' prefix, then comma-separated list.
# Example: MACs -hmac-md5,hmac-md5-96,hmac-ripemd160,...
# Do NOT prefix each MAC with '-' — OpenSSH ignores invalid names silently.
- name: Set MACs exclusion line in sshd_config
  ansible.builtin.lineinfile:
    path: "{{ ssh_macs_sshd_config }}"
    regexp: '^\s*#?\s*MACs\s+.*$'
    line: "MACs -{{ ssh_weak_macs | join(',') }}"
    insertbefore: '^\s*(Include|Match)\s'
    state: present
    backup: yes
    validate: 'sshd -t -f %s'
  notify: Reload sshd

# ──────────────────────────────────────────────────────────
# Flush handlers so sshd reloads before verification
# ──────────────────────────────────────────────────────────

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

# ──────────────────────────────────────────────────────────
# Verification
# ──────────────────────────────────────────────────────────

- name: Read sshd_config for MACs verification
  ansible.builtin.command: grep -i '^MACs' {{ ssh_macs_sshd_config }}
  register: ssh_macs_config_check
  changed_when: false
  failed_when: false

- name: Verify MACs directive is set
  ansible.builtin.assert:
    that:
      - "'MACs' in ssh_macs_config_check.stdout"
    fail_msg: >-
      MACs directive not found in {{ ssh_macs_sshd_config }}.
      Run: grep -i '^MACs' {{ ssh_macs_sshd_config }}
    success_msg: "MACs directive is present in sshd_config."

- name: Verify all weak MACs are excluded
  ansible.builtin.assert:
    that:
      - "item in ssh_macs_config_check.stdout"
    fail_msg: "Weak MAC '{{ item }}' not found in MACs exclusion list."
    success_msg: "Weak MAC '{{ item }}' is excluded."
  loop: "{{ ssh_weak_macs }}"

- name: Verify effective MAC config via sshd -T
  ansible.builtin.command: sshd -T -f {{ ssh_macs_sshd_config }}
  register: ssh_macs_effective
  changed_when: false
  failed_when: false

- name: Verify no weak MACs appear in effective config
  ansible.builtin.assert:
    that:
      - "item not in ssh_macs_effective.stdout | lower"
    fail_msg: >-
      Weak MAC '{{ item }}' is still in the effective sshd config.
      Run: sshd -T -f {{ ssh_macs_sshd_config }} | grep -i macs
    success_msg: "Weak MAC '{{ item }}' is not in effective config."
  loop: "{{ ssh_weak_macs }}"
  when: ssh_macs_effective.rc == 0

- name: Report SSH MAC hardening status
  ansible.builtin.debug:
    msg: >-
      SSH MACs configured: {{ ssh_weak_macs | length }} weak algorithms excluded
      (including CVE-2023-48795 ETM MACs).
