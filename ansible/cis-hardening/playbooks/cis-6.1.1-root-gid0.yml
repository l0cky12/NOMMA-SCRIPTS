---
# playbooks/cis-6.1.1-root-gid0.yml
#
# CIS 6.1.1 - Ensure group root is the only GID 0 group
#
# Compliance Mapping:
#   CIS:   6.1.1
#   NIST:  AC-6, IA-2
#   MITRE: T1078.003 (Local Accounts: Root)
#
# Usage:
#   ansible-playbook -i inventory/hosts.yml playbooks/cis-6.1.1-root-gid0.yml
#
# Or via site.yml with tags:
#   ansible-playbook -i inventory/hosts.yml playbooks/site.yml --tags cis-6.1.1

- name: CIS 6.1.1 - Ensure only root has GID 0
  hosts: linux_servers
  become: true

  roles:
    - role: root_gid0
      tags: [cis, hardening, cis_accounts, cis-6.1.1, cis_6_1_1]
