---
# playbooks/cis-5.2.12-ssh-idle-timeout.yml
#
# CIS 5.2.12 - Ensure SSH Idle Timeout Interval is configured
# Sets ClientAliveInterval and ClientAliveCountMax to enforce
# automatic disconnection of idle SSH sessions.
#
# Compliance Mapping:
#   CIS:   5.2.12
#   NIST:  AC-12, SC-10
#   MITRE: T1499 (Endpoint Denial of Service)
#
# Usage:
#   ansible-playbook -i inventory/hosts.yml playbooks/cis-5.2.12-ssh-idle-timeout.yml
#
# Or via site.yml with tags:
#   ansible-playbook -i inventory/hosts.yml playbooks/site.yml --tags cis-5.2.12

- name: CIS 5.2.12 - Configure SSH idle timeout interval
  hosts: linux_servers
  become: true

  roles:
    - role: ssh_idle_timeout
      tags: [cis, hardening, cis_ssh, cis-5.2.12, cis_5_2_12]
