---
# playbooks/site.yml
#
# NOMMA CIS hardening — single entry point with tags.
#
# Usage:
#   # Run everything:
#   ansible-playbook -i inventory.ini playbooks/site.yml
#
#   # Run only specific controls by tag:
#   ansible-playbook -i inventory.ini playbooks/site.yml --tags baseline
#   ansible-playbook -i inventory.ini playbooks/site.yml --tags apparmor
#   ansible-playbook -i inventory.ini playbooks/site.yml --tags motd
#   ansible-playbook -i inventory.ini playbooks/site.yml --tags login_banner
#   ansible-playbook -i inventory.ini playbooks/site.yml --tags "motd_perms,banner_perms"
#   ansible-playbook -i inventory.ini playbooks/site.yml --tags crontab_perms
#   ansible-playbook -i inventory.ini playbooks/site.yml --tags cron_dir_perms
#
#   # List all available tags:
#   ansible-playbook -i inventory.ini playbooks/site.yml --list-tags
#
#   # Dry run (check mode):
#   ansible-playbook -i inventory.ini playbooks/site.yml --tags baseline --check
#
#   # Run everything except one control:
#   ansible-playbook -i inventory.ini playbooks/site.yml --skip-tags apparmor
#
#   # Single host:
#   ansible-playbook -i inventory.ini playbooks/site.yml --limit NOMMA-ROOTCA01
#
# Order matters: content first, permissions last, GRUB (reboot) in between.
#   1. baseline        — packages, users, sudo
#   2. motd            — MOTD content (CIS 1.6.1)
#   3. login_banner    — banner content (CIS 1.6.2 + 1.6.3)
#   4. apparmor        — GRUB params (CIS 1.3.1.2)
#   5. motd_perms      — MOTD permissions (CIS 1.6.4)
#   6. banner_perms    — banner permissions (CIS 1.7.1 + 1.7.2)
#   7. crontab_perms   — /etc/crontab permissions (root:root 0600)
#   8. cron_dir_perms  — cron dir permissions (root:root 0700)

- name: NOMMA CIS hardening
  hosts: nomma_linux
  become: true

  roles:
    - role: baseline_hardening
      tags: [baseline, packages, users]

    - role: motd_hardening
      tags: [motd, cis-1.6.1]

    - role: login_banner
      tags: [login_banner, cis-1.6.2, cis-1.6.3]

    - role: apparmor_grub
      tags: [apparmor, cis-1.3.1.2, grub]

    - role: motd_permissions
      tags: [motd_perms, cis-1.6.4]

    - role: banner_permissions
      tags: [banner_perms, cis-1.7.1, cis-1.7.2]

    - role: crontab_permissions
      tags: [crontab_perms, cron]

    - role: cron_dir_permissions
      tags: [cron_dir_perms, cron]

    - role: ssh_key_only
      tags: [ssh_key_only, cis-5.2.4, cis_ssh]

    - role: ssh_access
      tags: [ssh_access, cis-5.2.8, cis_ssh]

    - role: ssh_login_grace_time
      tags: [ssh_login_grace_time, cis-5.2.13, cis_ssh]

    - role: ssh_max_auth_tries
      tags: [ssh_max_auth_tries, cis-5.2.x, cis_ssh]

    - role: ssh_idle_timeout
      tags: [ssh_idle_timeout, cis-5.2.12, cis_ssh]

    - role: ssh_disable_forwarding
      tags: [ssh_disable_forwarding, cis-5.2.19, cis_ssh]

    - role: ssh_macs
      tags: [ssh_macs, cis-5.2.14, cis_ssh]

    - role: ssh_maxstartups
      tags: [ssh_maxstartups, cis-5.2.15, cis_ssh]

    - role: ssh_permit_root_login
      tags: [ssh_permit_root_login, cis-5.2.7, cis_ssh]

    - role: sudo_logfile
      tags: [sudo_logfile, cis-5.3.1, cis_sudo]

    - role: sudo_timeout
      tags: [sudo_timeout, cis-5.3.2, cis_sudo]

    - role: su_restriction
      tags: [su_restriction, cis-5.3.3, cis_sudo]

    - role: root_gid0
      tags: [root_gid0, cis-6.1.1, cis_accounts]

    - role: root_account
      tags: [root_account, cis-6.1.2, cis_accounts]
